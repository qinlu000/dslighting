### model
model_name_or_path: /data/caoqinlu/models/Qwen3-4B-Instruct-2507
trust_remote_code: true
flash_attn: sdpa

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: /data/caoqinlu/projects/DataMind/datamind/train/sft/LLaMA-Factory/examples/deepspeed/ds_z2_config.json

### dataset
dataset: training_mix_perception_joint_v1
dataset_dir: /data/caoqinlu/projects/dslighting/paper/training_mix/artifacts/cold_start/perception_sft_final_medium_t09_qwen3_24k/llamafactory
template: qwen3
enable_thinking: false
cutoff_len: 24576
train_on_prompt: false
mask_history: false
packing: false
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2

### output
output_dir: /data/caoqinlu/runs/training_mix_sft/qwen3-4b-perception-joint-zero2-24k-final-medium-t09
overwrite_output_dir: false
logging_dir: /data/caoqinlu/runs/training_mix_sft/qwen3-4b-perception-joint-zero2-24k-final-medium-t09/tensorboard
logging_steps: 1
save_strategy: steps
save_steps: 25
save_total_limit: 3
save_only_model: false
plot_loss: true
report_to: tensorboard

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
optim: adamw_torch
weight_decay: 0.0
max_grad_norm: 1.0
average_tokens_across_devices: true
bf16: true
disable_gradient_checkpointing: false
seed: 42
data_seed: 42
ddp_timeout: 180000000
resume_from_checkpoint: null
